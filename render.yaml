services:
  - type: web
    name: recordioai-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: recordioai
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-20b
    autoDeploy: true