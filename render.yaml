services:
  - type: web
    name: recordioai-api
    runtime: docker
    region: oregon
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: recordioai
      - key: META_API_KEY
        sync: false
      - key: META_ASR_MODEL
        value: muse-voice-transcribe-1.0
      - key: META_ASR_TIMEOUT_SECONDS
        value: 120
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-20b
      - key: PROVENANCE_RELAYER_PRIVATE_KEY
        sync: false
      - key: MONAD_RELAYER_RPC_URL
        value: https://testnet-rpc.monad.xyz
    autoDeploy: true